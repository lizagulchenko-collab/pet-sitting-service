{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pet Sitting Service{% endblock %}</title>

  <link rel="stylesheet" href="{% static "css/styles.css" %}">

  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="app-container">
    {% include "includes/sidebar.html" %}

    <main class="main-content">
      {% if messages %}
        {% for message in messages %}
          <div class="card" style="background-color: var(--color-cream-bg); border-color: var(--color-pink-accent);">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

    {% block content %}
    {% endblock %}
  </main>
</div>
</body>
</html>
